name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generated schema drift
        run: pnpm schema:check
      - name: Quality gate
        run: pnpm check
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: CLI smoke
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js validate fixtures/demo/receipt.json --json
          node dist/cli.js verify fixtures/demo/receipt.json --root fixtures/demo --json
          node dist/cli.js compare fixtures/demo/receipt.json fixtures/demo/receipt.json --json
          if node dist/cli.js validate fixtures/demo/draft.json --json; then
            echo "invalid draft unexpectedly validated" >&2
            exit 1
          fi
      - name: Package dry-run
        if: runner.os == 'Linux'
        shell: bash
        run: npm pack --dry-run --json --ignore-scripts | pnpm exec tsx scripts/verify-pack-manifest.ts
